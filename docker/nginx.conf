# nginx for the frontend container: serves the React build and forwards API calls to the
# backend container, so the browser only ever talks to one origin (no CORS needed).
#
# Only /api/ and /health reach the backend. The API docs (/docs, /openapi.json) are not
# proxied, so they are not public; in development Vite still proxies them.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's internal DNS. Resolving the backend per request (via a variable) means a
    # restarted backend container with a new IP address is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Note: add_header in a location replaces the server-level ones, so every location
    # repeats the security headers.

    # Container health check (does not depend on the backend).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API and backend health: forwarded unchanged (FastAPI's own JSON errors pass through).
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /health {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite's hashed build files (index-<hash>.js): the name changes whenever the content
    # does, so browsers may cache them for a year.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must be revalidated on every visit, so a new deployment (new asset names)
    # reaches users immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else: a real file (favicon) or a React Router route (/search,
    # /products/42, unknown pages), which all get index.html (the app shows its own 404).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
